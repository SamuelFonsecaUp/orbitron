<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Orbitron Logo">
  <title>Orbitron</title>
  <defs>
    <!-- Base dark cosmic canvas -->
    <linearGradient id="orb-space-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <!-- Luminous Aurora Nebula Gradient - Violet/Purple Core -->
    <radialGradient id="orb-aurora-core" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.65" />
      <stop offset="75%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0b0e17" stop-opacity="0" />
    </radialGradient>
    <!-- Cyan Aurora (Top-Left) -->
    <radialGradient id="orb-aurora-cyan" cx="25%" cy="25%" r="48%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <!-- Emerald Aurora (Bottom-Right) -->
    <radialGradient id="orb-aurora-emerald" cx="80%" cy="80%" r="48%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <!-- Amber Aurora (Bottom-Left) -->
    <radialGradient id="orb-aurora-amber" cx="15%" cy="85%" r="38%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <!-- 4 Spectrum Border Stroke -->
    <linearGradient id="orb-cosmic-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.7" />
    </linearGradient>
    <!-- Soft Drop Shadow on Pure White Logo -->
    <filter id="orb-white-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Background Squircle Container -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#orb-space-base)" />
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#orb-aurora-core)" />
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#orb-aurora-cyan)" style="mix-blend-mode: screen;" />
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#orb-aurora-emerald)" style="mix-blend-mode: screen;" />
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#orb-aurora-amber)" style="mix-blend-mode: screen;" />
  <!-- Subtle Spectrum Border -->
  <rect x="3" y="3" width="506" height="506" rx="110" fill="none" stroke="url(#orb-cosmic-border)" stroke-width="4.5" opacity="0.75" />
  <!-- Pure White Logo -->
  <g transform="translate(90.75, 90.69)" filter="url(#orb-white-shadow)">
    <!-- Arc A (Upper/Right) -->
    <path fill="#ffffff" d="M330.5,187.56q-4,15.93-8,31.85a7,7,0,0,1-.45,1.43c-3.56,7-4.49,13,.5,20.78,6.79,10.53,2.78,25.21-6.69,33.53a28.94,28.94,0,0,1-34.37,3.08,29.33,29.33,0,0,1-12.82-32.55c3.23-12.11,14.57-21.34,27.32-20.8,6.28.26,8.36-2.1,10.35-7.46,31.59-84.95-21-180.22-109.75-198q-64.9-13-118.89,25.68C76.33,46,75,47,73.6,47.94a7.65,7.65,0,0,1-.94.43c-1.64-1.81-3.4-3.74-5.13-5.7S64.3,38.87,61.88,36c8.87-5.61,17.21-11.67,26.22-16.45C150.6-13.61,226.07-4,278,43.91c28.35,26.18,45.65,58.57,51.57,96.86a16.26,16.26,0,0,0,.94,2.78Zm-20.94,65.71a13,13,0,0,0-26,.22c0,6.81,6.32,13.08,13.14,13A13.42,13.42,0,0,0,309.56,253.27Z" />
    <!-- Arc B (Lower/Left) -->
    <path fill="#ffffff" d="M144.5,330.62c-8.22-1.91-16.63-3.22-24.63-5.82-65-21.08-104.6-65.11-117.26-132.4C-3.13,161.92.78,132,12.55,103.26c1.21-3,1.13-4.92-.94-7.56a28.6,28.6,0,0,1-.15-35.23c7.73-10.24,22-14,34.12-9C57.35,56.33,64.8,68.78,63.29,81.06,61.61,94.73,52,104.68,38.54,106.69c-1,.14-2.09.69-2.94.42-7.45-2.27-8.7,3-10.56,8.15C-6.2,201.69,48.16,296.32,138.72,312.82c42.18,7.68,80.6-1.65,115.41-26.43,1.5-1.07,3-2.17,4.45-3.23a5.35,5.35,0,0,1,1.19-.38l10.33,11.56c-2.22,1.76-4.17,3.43-6.25,4.94-22.36,16.21-47.08,26.66-74.53,30.44a16.48,16.48,0,0,0-2.82.9ZM34.91,65.31a13,13,0,0,0-13.4,12.62A13.22,13.22,0,0,0,34,91.06a13.27,13.27,0,0,0,13.45-12.7A13.09,13.09,0,0,0,34.91,65.31Z" />
    <!-- Core Ring -->
    <path fill="#ffffff" d="M74.18,165.87a91.92,91.92,0,0,1,91.69-92.11c50.12-.22,91.58,41.22,91.7,91.65s-40.74,92.08-90.49,92.11C115.15,257.54,74.24,217.19,74.18,165.87Zm16.07-.18c-.24,40.74,33.51,75.59,73.42,75.82,43,.26,77.62-32.83,77.91-74.45.29-42.45-33.35-77-75.28-77.23C124.55,89.57,90.49,123.54,90.25,165.69Z" />
  </g>
</svg>